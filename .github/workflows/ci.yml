name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Job 1: Quality Checks (runs on every PR and push) ─────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript projects)
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage -- --run
        env:
          CI: true

      - name: Verify coverage thresholds
        run: |
          echo "Coverage thresholds are enforced in vitest.config.js"
          echo "If this step fails, coverage dropped below minimum"

      - name: Security audit
        run: npm audit --audit-level=high
        # Fails if CRITICAL or HIGH vulnerabilities found

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true  # Don't block on false positives

      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: ${{ vars.APP_NAME || 'App' }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_API_BASE_URL: ${{ vars.STAGING_API_URL || 'https://api.example.com' }}

      - name: Analyze bundle size
        run: |
          echo "=== Bundle Size Analysis ==="
          
          # Find the main JS bundle
          MAIN_BUNDLE=$(find dist/assets -name "index-*.js" 2>/dev/null | head -1)
          
          if [ -z "$MAIN_BUNDLE" ]; then
            echo "⚠️  No main bundle found, checking all JS files..."
            MAIN_BUNDLE=$(find dist/assets -name "*.js" | sort -S | tail -1)
          fi
          
          if [ -n "$MAIN_BUNDLE" ]; then
            BUNDLE_SIZE=$(gzip -c "$MAIN_BUNDLE" | wc -c)
            BUNDLE_KB=$((BUNDLE_SIZE / 1024))
            echo "Main bundle: ${BUNDLE_KB}KB gzipped (${BUNDLE_SIZE} bytes)"
            
            if [ $BUNDLE_SIZE -gt 102400 ]; then
              echo "❌ FAIL: Main bundle ${BUNDLE_KB}KB exceeds 100KB limit"
              echo "Run 'npx vite-bundle-visualizer' to analyze what's large"
              exit 1
            else
              echo "✅ PASS: Main bundle ${BUNDLE_KB}KB is within 100KB limit"
            fi
          fi
          
          # Total JS size
          TOTAL_JS=$(find dist/assets -name "*.js" -exec gzip -c {} \; | wc -c)
          TOTAL_KB=$((TOTAL_JS / 1024))
          echo "Total JS: ${TOTAL_KB}KB gzipped"
          
          if [ $TOTAL_JS -gt 512000 ]; then
            echo "⚠️  WARNING: Total JS ${TOTAL_KB}KB exceeds 500KB recommendation"
          fi

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Job 2: Lighthouse CI (on PRs only) ────────────────────
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: 'App'
          VITE_API_BASE_URL: 'https://api.example.com'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true  # Don't block PR on Lighthouse failures

  # ── Job 3: Deploy to Staging (on merge to main) ───────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Deploy to Vercel (staging)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Staging health check
        run: |
          URL="${{ steps.deploy.outputs.preview-url }}"
          echo "Health check: $URL"
          
          # Wait for deployment to be ready
          sleep 15
          
          # Check HTTP status
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Staging health check passed (HTTP $STATUS)"
          else
            echo "❌ Staging health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Comment staging URL on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Staging deployment ready**\n\n${process.env.STAGING_URL}\n\nRun manual QA using \`Act as Forge QA Agent\` with this URL.`
            })
        env:
          STAGING_URL: ${{ steps.deploy.outputs.preview-url }}

  # ── Job 4: Deploy to Production (manual approval required) ─
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://your-app.com
    # Requires manual approval in GitHub → Settings → Environments → production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Deploy to Vercel (production)
        id: deploy-prod
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Production health check
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 30
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://your-app.com")
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Production health check passed"
          else
            echo "❌ Production health check FAILED (HTTP $STATUS)"
            echo "Consider rolling back: vercel rollback"
            exit 1
          fi

      - name: Notify team on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "✅ Production deployment successful: https://your-app.com (commit: ${{ github.sha }})"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Notify team on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Production deployment FAILED. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
